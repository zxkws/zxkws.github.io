name: deploy_gh_pages

on:
  push:
    branches:
    - development
    paths-ignore:
      - README.md

jobs:
  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: main-app
            filter: main-app
            dist_path: packages/main-app/dist
            deploy_subdir: ''
          - name: v-app
            filter: v-app
            dist_path: packages/v-app/dist
            deploy_subdir: 'v-app'
          - name: vue-learning-app
            filter: vue-learning-app
            dist_path: packages/vue-learning-app/dist
            deploy_subdir: 'vue'
          - name: react-learning-app
            filter: react-learning-app
            dist_path: packages/react-learning-app/dist
            deploy_subdir: 'react'
          - name: pdf-editor-app
            filter: pdf-editor-app
            dist_path: packages/pdf-editor-app/dist
            deploy_subdir: 'pdf-editor-app'
          - name: person-resume-app
            filter: person-resume-app
            dist_path: packages/person-resume-app/dist
            deploy_subdir: 'person-resume-app'
          - name: textdifference
            filter: textdifference
            dist_path: packages/textDifference/dist
            deploy_subdir: 'textdiff'
          - name: config-center
            filter: config-center
            dist_path: packages/config-center/dist
            deploy_subdir: 'config-center'
          - name: config-hub
            filter: config-hub
            dist_path: packages/config-hub/dist
            deploy_subdir: 'config-hub'
          - name: codex-chat-app
            filter: codex-chat-app
            dist_path: packages/codex-chat-app/dist
            deploy_subdir: 'codex-chat-app'
          - name: knowledge-hub-app
            filter: knowledge-hub-app
            dist_path: packages/knowledge-hub-app/dist
            deploy_subdir: 'knowledge-hub-app'
          - name: auth-app
            filter: auth-app
            dist_path: packages/auth-app/dist
            deploy_subdir: 'auth-app'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm --filter ${{ matrix.app.filter }} build

      - name: Prepare artifact
        run: |
          rm -rf upload
          mkdir -p upload
          if [ -z "${{ matrix.app.deploy_subdir }}" ]; then
            cp -a ${{ matrix.app.dist_path }}/. upload/
          else
            mkdir -p "upload/${{ matrix.app.deploy_subdir }}"
            cp -a ${{ matrix.app.dist_path }}/. "upload/${{ matrix.app.deploy_subdir }}/"
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app.name }}
          path: upload/**
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: deploy

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          mv deploy/* .
          rm -rf deploy
          cp index.html 404.html
          echo "zxkws.nyc.mn" > CNAME
          touch .nojekyll
          git add .
          git commit -m "Deploy all apps to GitHub Pages"
          git push -f origin gh-pages
