name: deploy_gh_pages

on:
  push:
    branches:
      - development
    paths-ignore:
      - README.md

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-matrix:
    name: Discover packages
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const packagesDir = path.join(process.cwd(), 'packages');
          const overrides = {
            'main-app': { deploy_subdir: '' },
            'textDifference': {
              deploy_subdir: 'textdiff',
              dist_path: 'packages/textDifference/dist',
              filter: 'textdifference', // pnpm uses package name (lowercase)
            },
            'person-resume-app': {
              deploy_subdir: 'resume',
              filter: 'resume',
            },
            'react-learning-app': {
              deploy_subdir: 'react',
              filter: 'react',
            },
            'vue-learning-app': {
              deploy_subdir: 'vue',
              filter: 'vue',
            },
            'chess-mirror-app': {
              deploy_subdir: 'chess-mirror-app',
              filter: 'chess-mirror-app',
            },
          };

          const entries = fs.readdirSync(packagesDir).filter((name) =>
            fs.statSync(path.join(packagesDir, name)).isDirectory()
          );

          const apps = [];
          for (const name of entries) {
            const pkgPath = path.join(packagesDir, name, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            const pkgName = typeof pkg.name === 'string' ? pkg.name : name;
            // Skip internal libraries (deploy only actual apps to GitHub Pages)
            if (pkgName.startsWith('@zxkws/')) continue;
            if (!pkg.scripts || !pkg.scripts.build) continue;
            const override = overrides[name] || {};
            apps.push({
              name,
              filter: override.filter || pkgName,
              dist_path: override.dist_path || `packages/${name}/dist`,
              deploy_subdir:
                override.deploy_subdir !== undefined ? override.deploy_subdir : name,
            });
          }

          if (!apps.length) throw new Error('No buildable packages found');
          const matrix = { app: apps };
          console.log('Resolved matrix:', JSON.stringify(matrix, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          NODE

  build:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-22.04
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: pnpm --filter ${{ matrix.app.filter }} build

      - name: Prepare artifact
        run: |
          rm -rf upload
          mkdir -p upload
          if [ -z "${{ matrix.app.deploy_subdir }}" ]; then
            cp -a ${{ matrix.app.dist_path }}/. upload/
          else
            mkdir -p "upload/${{ matrix.app.deploy_subdir }}"
            cp -a ${{ matrix.app.dist_path }}/. "upload/${{ matrix.app.deploy_subdir }}/"
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app.name }}
          path: upload/**
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: deploy

      - name: Preserve CNAME
        run: |
          if [ -f CNAME ]; then cp CNAME deploy/CNAME; fi

      - name: Validate deploy output
        run: |
          test -f deploy/index.html

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          mv deploy/* .
          rm -rf deploy
          cp index.html 404.html
          touch .nojekyll
          git add .
          git commit -m "Deploy all apps to GitHub Pages"
          git push -f origin gh-pages
