name: deploy_gh_pages

on:
  push:
    branches:
    - development
    paths-ignore:
      - README.md

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
            echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Main App
        run: pnpm --filter main-app build

      - name: Build v-app
        run: pnpm --filter v-app build

      - name: Build textDifference
        run: pnpm --filter textdifference build

      - name: Build config-center
        run: pnpm --filter config-center build

      - name: Prepare Deployment
        run: |
          mkdir -p deploy
          cp -r packages/main-app/dist/* deploy/
          cp -r packages/v-app/dist deploy/v-app
          cp -r packages/textDifference/dist deploy/textdiff
          cp -r packages/config-center/dist deploy/config-center

      - name: Deploy to GitHub Pages
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.actor }}@users.noreply.github.com"
            git checkout --orphan gh-pages
            git rm -rf .
            mv deploy/* .
            rm -rf node_modules packages deploy
            cp index.html 404.html
            echo "zxkws.nyc.mn" > CNAME
            touch .nojekyll
            git add .
            git commit -m "Deploy all apps to GitHub Pages"
            git push -f origin gh-pages