        "@context": "https://schema.org",

        "inLanguage": "zh-CN",
        "description": "一个属于创造、记录与探索的数字空间。"
      }</script><script>(() => {
        try {
          const savedLanguage = window.localStorage.getItem('lightspace-language');
          const language =
            savedLanguage === 'zh-CN' || savedLanguage === 'en-US'
              ? savedLanguage
              : window.navigator.language.toLowerCase().startsWith('zh')
                ? 'zh-CN'
                : 'en-US';
          document.documentElement.lang = language;
          document.documentElement.dataset.language = language;
        } catch {
          // Keep the document default when browser storage is unavailable.
        }
      })();</script><script>(() => {
        try {
          const savedTheme = window.localStorage.getItem('main-app-theme');
          const theme =
            savedTheme === 'dark' || savedTheme === 'light'
              ? savedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
          const themeColor = document.head.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#151515' : '#ffffff');
        } catch {
          // Keep the light theme when browser storage is unavailable.
        }
      })();</script><script>(() => {
        const origin = window.location.origin;
        const selectOrCreate = (selector, tag, attributes) => {
          const existing = document.head.querySelector(selector);
          if (existing) return existing;
          const el = document.createElement(tag);
          Object.entries(attributes || {}).forEach(([key, value]) => el.setAttribute(key, value));
          document.head.appendChild(el);
          return el;
        };

        const syncUrl = (path) => {
          const canonicalUrl = origin.replace(/\/$/, '') + path;
          selectOrCreate('link[rel="canonical"]', 'link', { rel: 'canonical' }).setAttribute('href', canonicalUrl);
          selectOrCreate('meta[property="og:url"]', 'meta', { property: 'og:url' }).setAttribute(
            'content',
            canonicalUrl,
          );
          selectOrCreate('meta[name="twitter:url"]', 'meta', { name: 'twitter:url' }).setAttribute(
            'content',
            canonicalUrl,
          );
          return canonicalUrl;
        };

        const syncImage = (path) => {
          const imageUrl = origin.replace(/\/$/, '') + path;
          selectOrCreate('meta[property="og:image"]', 'meta', { property: 'og:image' }).setAttribute(
            'content',
            imageUrl,
          );
          selectOrCreate('meta[name="twitter:image"]', 'meta', { name: 'twitter:image' }).setAttribute(
            'content',
            imageUrl,
          );
        };

        const syncSchema = (canonicalUrl) => {
          const schemaEl = document.head.querySelector('script[type="application/ld+json"]');
          if (!schemaEl || !schemaEl.textContent) return;
          try {
            const data = JSON.parse(schemaEl.textContent);
            if (!data || typeof data !== 'object') return;
            data.url = canonicalUrl;
            schemaEl.textContent = JSON.stringify(data);
          } catch {
            // ignore
          }
        };

        const current = window.location.pathname + window.location.search + window.location.hash;
        const canonicalUrl = syncUrl(current || '/');
        syncImage('/lightspace-mark.svg');
        syncSchema(canonicalUrl);

          const nextPath = typeof event.detail === 'string' ? event.detail : window.location.pathname;
          const next = nextPath + window.location.search + window.location.hash;
          syncSchema(syncUrl(next || '/'));
        });
      })();</script><script defer="defer" src="/js/runtime.b797273b.js"></script><script defer="defer" src="/js/framework.fb00f216.js"></script><script defer="defer" src="/js/753.39dd6b17.js"></script><script defer="defer" src="/js/main.df32dadc.js"></script><link href="/css/main.40b6a774.css" rel="stylesheet"></head><body><div id="main-app-container"></div></body></html>
