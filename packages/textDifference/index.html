<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文本比对 | ZXKWS Hub</title>
    <script src="./diffMatchPatch.js"></script>
    <script src="script.js" defer></script>
    <style>
      :root {
        --color-text: #0f172a;
        --color-text-muted: #64748b;
        --bg-input: rgba(255, 255, 255, 0.5);
        --border-input: rgba(148, 163, 184, 0.3);
        --primary: #0ea5e9;
        --primary-hover: #0284c7;
        --diff-add-bg: rgba(34, 197, 94, 0.2);
        --diff-add-text: #15803d;
        --diff-del-bg: rgba(239, 68, 68, 0.2);
        --diff-del-text: #b91c1c;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-text: #f1f5f9;
          --color-text-muted: #94a3b8;
          --bg-input: rgba(15, 23, 42, 0.3);
          --border-input: rgba(255, 255, 255, 0.1);
          --primary: #38bdf8;
          --primary-hover: #7dd3fc;
          --diff-add-bg: rgba(34, 197, 94, 0.25);
          --diff-add-text: #86efac;
          --diff-del-bg: rgba(239, 68, 68, 0.25);
          --diff-del-text: #fca5a5;
        }
      }

      * { box-sizing: border-box; }
      
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Inter', system-ui, sans-serif;
        background: transparent; /* Allows parent Glass OS background to show */
        color: var(--color-text);
        overflow: hidden; /* Main app handles scroll if needed, but here we want internal scroll */
      }

      body {
        display: flex;
        flex-direction: column;
        padding: 24px;
        overflow-y: auto;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--color-text-muted); opacity: 0.3; border-radius: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }

      header {
        text-align: center;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 8px 0;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: var(--color-text-muted);
        font-size: 14px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        flex: 1;
        min-height: 300px;
      }

      textarea {
        width: 100%;
        height: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border-input);
        border-radius: 12px;
        padding: 16px;
        color: var(--color-text);
        font-family: 'Menlo', 'Monaco', monospace;
        font-size: 14px;
        resize: none;
        outline: none;
        transition: all 0.2s;
      }

      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        background: rgba(255,255,255,0.05); /* Slight highlight */
      }

      .actions {
        display: flex;
        justify-content: center;
        margin: 24px 0;
      }

      button {
        background: var(--primary);
        color: white; /* Always white for Sky Blue */
        border: none;
        padding: 10px 32px;
        border-radius: 50px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        transition: all 0.2s;
      }

      @media (prefers-color-scheme: dark) {
        button {
          color: #0f172a; /* Dark text on bright button in dark mode */
        }
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        background: var(--primary-hover);
      }

      button:active { transform: translateY(0); }

      #diffOutput {
        background: var(--bg-input);
        border: 1px solid var(--border-input);
        border-radius: 12px;
        padding: 24px;
        font-family: 'Menlo', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        min-height: 100px;
      }

      /* Diff Styles */
      .diff-add {
        background-color: var(--diff-add-bg);
        color: var(--diff-add-text);
        text-decoration: none;
        padding: 2px 0;
        border-radius: 2px;
      }
      
      .diff-del {
        background-color: var(--diff-del-bg);
        color: var(--diff-del-text);
        text-decoration: line-through;
        padding: 2px 0;
        border-radius: 2px;
        opacity: 0.8;
      }

      @media (max-width: 768px) {
        .container { grid-template-columns: 1fr; }
        body { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>文本比对工具</h1>
      <p>粘贴两段文本，快速检查差异</p>
    </header>

    <div class="container">
      <textarea id="text1" placeholder="在此粘贴原始文本..."></textarea>
      <textarea id="text2" placeholder="在此粘贴修改后的文本..."></textarea>
    </div>

    <div class="actions">
      <button id="compareBtn">开始比对</button>
    </div>

    <div id="diffOutput"></div>
  </body>
</html>
